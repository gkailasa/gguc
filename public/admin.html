<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GGUC 2026 — Admin</title>
<link rel="icon" type="image/png" href="icons/galaxy_logo.png">
<link rel="shortcut icon" type="image/png" href="icons/galaxy_logo.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body>

<div class="header">
  <div>
    <div class="header-brand">GGUC 2026</div>
    <div class="header-sub">Admin View</div>
  </div>
  <button class="logout-btn" id="logout-btn" style="display:none" onclick="logout()">Sign out</button>
</div>

<!-- Password Screen -->
<div id="login-screen">
  <div class="login-card">
    <h2>Admin Access</h2>
    <p>Enter admin password to view registrations</p>
    <input type="password" id="pwd-input" placeholder="Password" inputmode="text" autocomplete="current-password" onkeydown="if(event.key==='Enter') login()">
    <button class="login-btn" id="login-btn" onclick="login()">Continue</button>
    <div class="login-error" id="login-error">Incorrect password. Please try again.</div>
  </div>
</div>

<!-- Admin Dashboard -->
<div id="admin-screen">
  <div class="admin-topbar">
    <div id="user-pill" class="user-pill" style="display:none;"></div>
    <button class="logout-btn" onclick="refreshAdmin()" id="refresh-btn" style="background:var(--teal); border-color:rgba(201,168,76,0.4); color:var(--gold);">&#8635; Refresh</button>
  </div>
  
  <div class="summary-bar" id="summary-bar"></div>

  <!-- Unified Top Controls Header -->
  <div class="controls-card">
    <!-- Event Selectors (Tabs) -->
    <div class="tabs-wrapper">
      <div class="tabs" id="tabs"></div>
    </div>

    <!-- Filters Row: Search, Date, Status -->
    <div class="global-controls" id="global-controls">
      <div class="card-search-wrap">
        <input type="search" id="global-search" class="card-search-input" placeholder="🔍 Search Flat #, Name, or Phone…">
      </div>

      <!-- Daily Pooja Specific Date Filter -->
      <div id="date-filter-wrap" class="date-filter-wrap" style="display: none;">
        <select id="date-filter-select" class="date-select-input">
          <option value="ALL">All Dates</option>
        </select>
      </div>

      <!-- Status Toggle Bar -->
      <div class="filter-toggle-container" id="status-toggle-bar">
        <button class="filter-toggle-btn" data-status="PENDING">Pending</button>
        <button class="filter-toggle-btn" data-status="RECEIVED">Paid</button>
        <button class="filter-toggle-btn" data-status="ALL">All</button>
      </div>
    </div>
  </div>

  <!-- Registration Cards Area -->
  <div id="panels-container"></div>
</div>

<!-- Confirmation Modal -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal-card">
    <div class="modal-title">Confirm Payment</div>
    <p style="font-size: 12px; color: var(--muted); margin-top: 2px;">Double check resident details before proceeding.</p>
    
    <div class="modal-body">
      <div class="modal-detail"><span>Flat Number:</span><span id="modal-flat">—</span></div>
      <div class="modal-detail"><span>Resident Name:</span><span id="modal-name">—</span></div>
      <div class="modal-detail"><span>Event:</span><span id="modal-event">—</span></div>
    </div>

    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel" onclick="closeConfirmModal()">Cancel</button>
      <button class="modal-btn modal-btn-confirm" id="modal-confirm-btn">Confirm Received</button>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
