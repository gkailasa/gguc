<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GGUC 2026 — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/gridjs/dist/theme/mermaid.min.css" rel="stylesheet">
<link href="admin.css" rel="stylesheet">
</head>
<body>

<div class="header">
  <div>
    <div class="header-brand">GGUC 2026</div>
    <div class="header-sub">Admin View</div>
  </div>
  <button class="logout-btn" id="logout-btn" style="display:none" onclick="logout()">Sign out</button>
</div>

<!-- Password screen -->
<div id="login-screen">
  <div class="login-card">
    <h2>Admin Access</h2>
    <p>Enter the admin password to view registrations</p>
    <input type="password" id="pwd-input" placeholder="Password" onkeydown="if(event.key==='Enter') login()">
    <button class="login-btn" id="login-btn" onclick="login()">Continue</button>
    <div class="login-error" id="login-error">Incorrect password. Please try again.</div>
  </div>
</div>

<!-- Admin screen -->
<div id="admin-screen">
  <div style="display:flex;justify-content:flex-end;margin-bottom:16px;">
    <button class="logout-btn" onclick="refreshAdmin()" id="refresh-btn" style="border-color:rgba(201,168,76,0.4);color:var(--gold);background:var(--teal);">&#8635; Refresh</button>
  </div>
  <div class="summary-bar" id="summary-bar"></div>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gridjs/dist/gridjs.umd.js"></script>
<script src="common.js"></script>
<script src="admin.js"></script>
</body>
</html>
